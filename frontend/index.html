<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlassQR — Gerador de QR Code Profissional Grátis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./assets/logo.png">
</head>
<body>

<main id="app" class="container">
    <div class="theme-wrapper">
        <button id="theme-toggle" class="btn-theme" title="Alternar tema">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
        </button>
    </div>

    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <p>Deseja apagar todo o seu histórico?</p>
            <div class="modal-actions">
                <button id="confirmClear">Sim</button>
                <button id="closeModal">Cancelar</button>
            </div>
        </div>
    </div>

    <header class="app-header">
        <div class="logo-area">
            <img src="./assets/logo.png" alt="Logo GlassQR" class="main-logo">
        </div>
        <h1>GlassQR<span class="highlight">Code</span></h1>
        <p class="subtitle">Sua identidade em cada conexão</p>
    </header>
<div class="form-group">
    <label>O que você deseja gerar?</label>
    <div class="custom-select-wrapper">
        <select id="type" class="hidden">
            <option value="text">Texto</option>
            <option value="url">Link / URL</option>
            <option value="wifi">Rede Wi-Fi</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="vcard">Cartão de Contato</option>
            <option value="phone">Telefone</option>
        </select>

        <div class="custom-select" id="customSelect">
            <div class="custom-select-trigger">
                <span>📝 Texto</span>
                <div class="arrow"></div>
            </div>
            <div class="custom-options">
                <span class="custom-option selected" data-value="text">📝 Texto</span>
                <span class="custom-option" data-value="url">🌐 Link / URL</span>
                <span class="custom-option" data-value="wifi">📶 Rede Wi-Fi</span>
                <span class="custom-option" data-value="whatsapp">💬 WhatsApp</span>
                <span class="custom-option" data-value="vcard">👤 Contato</span>
                <span class="custom-option" data-value="phone">📱 Telefone</span>
            </div>
        </div>
    </div>
</div>

    <div id="fields"></div>

    <div class="actions">
        <button type="button" id="btnGenerate">Gerar QR Code</button>
        <button type="button" class="secondary" id="btnClear">Limpar</button>
    </div>

    <section id="result" aria-live="polite"></section>

    <hr class="divider">

    <button type="button" class="secondary toggle" id="btnToggleHistory">🕒 Ver histórico recente</button>

    <section id="history-container" class="hidden">
        <div class="history-header">
            <h3>Seus QR Codes</h3>
            <button type="button" class="btn-clear-history" id="btnClearHistory" title="Limpar tudo">🗑️</button>
        </div>
        <div id="history"></div>
    </section>
</main>

<footer style="margin-top:20px; font-size:12px; opacity:0.6; text-align: center;">
    © 2026 Tatiane Lima • MIT License
</footer>

<script src="script.js"></script>
</body>
</html>
